# =============================================
# Account Service Configuration
# =============================================

# Server
server.port=8081

# Application name
spring.application.name=account-service

# =============================================
# Active Profile (switch to 'mysql' when MySQL is available)
# =============================================
# spring.profiles.active=mysql

# =============================================
# H2 file database (persists under ./data/)
# =============================================
spring.datasource.url=jdbc:h2:file:./data/banking_accounts;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Console (accessible at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# JPA / Hibernate Configuration
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================
# Logging
# =============================================
logging.level.com.banking=DEBUG
logging.level.org.springframework.web=INFO

# =============================================
# JWT / Security
# =============================================
app.jwt.secret=bankingSystemJwtSecretKeyMustBeAtLeast32CharsLong123
app.jwt.expiration-ms=3600000
# Any localhost / 127.0.0.1 port (comma-separated patterns). Do not open index.html as file:// — use Live Server or similar.
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# =============================================
# Email — Gmail SMTP (App Password, not your normal Gmail password)
# Set before running: MAIL_USERNAME, MAIL_PASSWORD
# Optional override for From header: MAIL_FROM (defaults to MAIL_USERNAME)
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${spring.mail.username}}

# Default bootstrap admin (created on first run if missing)
app.admin.email=ittsblackghost@gmail.com
app.admin.password=Admin@12345
