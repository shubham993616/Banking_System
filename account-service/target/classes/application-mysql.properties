# =============================================
# MySQL Database Configuration
# Activate with: spring.profiles.active=mysql
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/banking_accounts?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Disable H2 console when using MySQL
spring.h2.console.enabled=false
