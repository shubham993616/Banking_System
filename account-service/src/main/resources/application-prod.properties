# =============================================
# Production profile (Render + Railway MySQL)
# Activate with: SPRING_PROFILES_ACTIVE=prod
# =============================================

server.port=${PORT:8081}

# Railway MySQL — set DB_URL, DB_USERNAME, DB_PASSWORD on Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.banking=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Vercel frontend origin(s), comma-separated patterns
# Example: https://your-app.vercel.app,https://*.vercel.app
app.cors.allowed-origin-patterns=${CORS_ORIGIN_PATTERNS}

# Actuator (Render health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
