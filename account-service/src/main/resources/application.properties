# =============================================
# Account Service Configuration
# =============================================

# Server (Render injects PORT in production)
server.port=${PORT:8081}

# Application name
spring.application.name=account-service

# =============================================
# MySQL Database (local)
# Override credentials via DB_USERNAME / DB_PASSWORD env vars
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banking_accounts?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.h2.console.enabled=false

# =============================================
# JPA / Hibernate Configuration
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# =============================================
# Logging
# =============================================
logging.level.com.banking=DEBUG
logging.level.org.springframework.web=INFO

# =============================================
# JWT / Security
# =============================================
app.jwt.secret=${JWT_SECRET:dev-secret}
app.jwt.expiration-ms=3600000
# Any localhost / 127.0.0.1 port (comma-separated patterns). Do not open index.html as file:// — use Live Server or similar.
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# =============================================
# Email — Gmail SMTP (App Password, not your normal Gmail password)
# Set before running: MAIL_USERNAME, MAIL_PASSWORD
# Optional override for From header: MAIL_FROM (defaults to MAIL_USERNAME)
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${spring.mail.username}}

# Default bootstrap admin (created on first run if missing)
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD:admin123}