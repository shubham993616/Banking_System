# =============================================
# Account Service Configuration
# =============================================

# Server
server.port=8081

# Application name
spring.application.name=account-service

# =============================================
# Active Profile (switch to 'mysql' when MySQL is available)
# =============================================
# spring.profiles.active=mysql

# =============================================
# H2 In-Memory Database (Default - works out of the box)
# =============================================
spring.datasource.url=jdbc:h2:file:./data/banking_accounts;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Console (accessible at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# JPA / Hibernate Configuration
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================
# Logging
# =============================================
logging.level.com.banking=DEBUG
logging.level.org.springframework.web=INFO
